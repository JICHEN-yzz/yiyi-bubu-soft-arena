name = "yiyi-bubu-soft-arena"
main = "src/index.mjs"
compatibility_date = "2026-10-22"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/ws", "/api/*"]

[[durable_objects.bindings]]
name = "ARENA_ROOMS"
class_name = "ArenaRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArenaRoom"]
